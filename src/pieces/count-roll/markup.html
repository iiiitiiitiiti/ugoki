<div class="m-count-roll">
  <div class="m-count-roll__track" tabindex="0" role="region" aria-label="特集">
    <div class="m-count-roll__slide" role="group" aria-roledescription="スライド" aria-label="1 / 4">
      <p class="m-count-roll__label">特集 01</p>
      <p class="m-count-roll__title">春の新作コレクション</p>
    </div>
    <div class="m-count-roll__slide" role="group" aria-roledescription="スライド" aria-label="2 / 4">
      <p class="m-count-roll__label">特集 02</p>
      <p class="m-count-roll__title">週末だけのワークショップ</p>
    </div>
    <div class="m-count-roll__slide" role="group" aria-roledescription="スライド" aria-label="3 / 4">
      <p class="m-count-roll__label">特集 03</p>
      <p class="m-count-roll__title">スタッフのおすすめ</p>
    </div>
    <div class="m-count-roll__slide" role="group" aria-roledescription="スライド" aria-label="4 / 4">
      <p class="m-count-roll__label">特集 04</p>
      <p class="m-count-roll__title">会員限定のお知らせ</p>
    </div>
  </div>
  <div class="m-count-roll__controls">
    <button class="m-count-roll__prev" type="button" aria-label="前のスライド" aria-disabled="true"></button>
    <p class="m-count-roll__counter" aria-hidden="true">
      <span class="m-count-roll__window"><span class="m-count-roll__digits"><span class="m-count-roll__digit">1</span><span class="m-count-roll__digit">2</span><span class="m-count-roll__digit">3</span><span class="m-count-roll__digit">4</span></span></span>
      <span class="m-count-roll__total">/ 4</span>
    </p>
    <button class="m-count-roll__next" type="button" aria-label="次のスライド"></button>
    <button class="m-count-roll__pause" type="button" aria-label="自動送りを止める" aria-pressed="false"></button>
  </div>
</div>
